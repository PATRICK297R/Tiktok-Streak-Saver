name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      changelog:
        description: 'Release notes (markdown). Leave empty to auto-generate a bare compare link.'
        required: false
        default: ''

env:
  DOTNET_VERSION: '9.0.203'
  PROJECT_PATH: 'src/TiktokStreakSaver/TiktokStreakSaver.csproj'

jobs:
  build-android:
    permissions: write-all
    runs-on: windows-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Apply CI SDK pin
      run: cp global.ci.json global.json

    - name: Decode Keystore
      run: |
        $keystoreBytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
        [IO.File]::WriteAllBytes("src/TiktokStreakSaver/streaksaver.keystore", $keystoreBytes)
        Write-Host "Keystore file created successfully"
      shell: pwsh

    - name: Validate signing configuration
      run: |
        if (-not (Test-Path "src/TiktokStreakSaver/streaksaver.keystore")) {
          Write-Error "streaksaver.keystore was not created. Check ANDROID_KEYSTORE_BASE64 secret."
          exit 1
        }
        $size = (Get-Item "src/TiktokStreakSaver/streaksaver.keystore").Length
        if ($size -lt 100) {
          Write-Error "streaksaver.keystore is too small ($size bytes). Secret may be empty or corrupt."
          exit 1
        }
        if ([string]::IsNullOrEmpty("$env:SIGNING_PASSWORD_CHECK")) {
          Write-Error "ANDROID_SIGNING_PASSWORD is not set. Cannot sign the APK."
          exit 1
        }
        Write-Host "Signing configuration validated: keystore=$size bytes, password=set"
      shell: pwsh
      env:
        SIGNING_PASSWORD_CHECK: ${{ secrets.ANDROID_SIGNING_PASSWORD }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Install MAUI workload
      run: dotnet workload install maui-android

    # maui-ios is deliberately NOT installed here: the iOS workload is macOS-only and asking for it
    # on a Windows runner fails the job before any build starts. The iOS app has its own workflow.
    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }} -p:TargetFrameworks=net9.0-android

    - name: Get version from tag
      id: get_version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          echo "TAG=v${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
        } else {
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh

    - name: Build Android Release
      run: |
        $ver = "${{ steps.get_version.outputs.VERSION }}"
        $parts = $ver -split '\.'
        # A tag like v2.1 is legal and used to crash this step with an index error; missing parts
        # are treated as 0, the same way the iOS workflow does it.
        while ($parts.Count -lt 3) { $parts += '0' }
        $vc = [int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2]
        Write-Host "Building with ApplicationVersion=$vc ApplicationDisplayVersion=$ver"
        dotnet publish ${{ env.PROJECT_PATH }} -f net9.0-android -c Release -o ./artifacts -p:TargetFrameworks=net9.0-android -p:ApplicationVersion=$vc -p:ApplicationDisplayVersion=$ver
      shell: pwsh
      env:
        ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}

    - name: Rename APK
      run: |
        $newName = "StreakSaver-v${{ steps.get_version.outputs.VERSION }}.apk"
        $stableName = "StreakSaver.apk"
        $apk = Get-ChildItem -Path ./artifacts -Filter "*-Signed.apk" | Select-Object -First 1
        if (-not $apk) {
          $apk = Get-ChildItem -Path ./artifacts -Filter "*.apk" | Select-Object -First 1
        }
        if ($apk) {
          Rename-Item -Path $apk.FullName -NewName $newName
          # Also publish a stable-named copy so the marketing site can link to
          # https://github.com/Jon2G/TiktokStreakSaver/releases/latest/download/StreakSaver.apk
          # without breaking every release.
          Copy-Item -Path "./artifacts/$newName" -Destination "./artifacts/$stableName" -Force
          echo "APK_NAME=$newName" >> $env:GITHUB_OUTPUT
          echo "APK_PATH=./artifacts/$newName" >> $env:GITHUB_OUTPUT
          echo "APK_STABLE_NAME=$stableName" >> $env:GITHUB_OUTPUT
          Get-ChildItem -Path ./artifacts -Filter "*.apk" |
            Where-Object { $_.Name -ne $newName -and $_.Name -ne $stableName } |
            Remove-Item -Force
          Write-Host "Published APK: $newName (+ stable copy: $stableName)"
        }
      shell: pwsh
      id: rename_apk

    - name: APK Identity Report
      run: |
        $ErrorActionPreference = 'SilentlyContinue'
        $apk = Get-ChildItem -Path ./artifacts -Filter "*.apk" | Select-Object -First 1
        if (-not $apk) { Write-Host "No APK found in ./artifacts"; exit 0 }
        $apkPath = $apk.FullName

        $sdkRoot = "$env:ANDROID_SDK_ROOT"
        $aapt = Get-ChildItem "$sdkRoot\build-tools" -Recurse -Filter "aapt.exe" |
                Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName

        Write-Host "========================================"
        Write-Host "  APK IDENTITY REPORT"
        Write-Host "========================================"

        if ($aapt) {
          $badging = & $aapt dump badging $apkPath 2>&1
          $packageLine = ($badging | Where-Object { $_ -match "^package:" }) | Select-Object -First 1
          if ($packageLine) {
            $pkgName = if ($packageLine -match "name='([^']+)'")  { $Matches[1] } else { "?" }
            $verCode = if ($packageLine -match "versionCode='([^']+)'") { $Matches[1] } else { "?" }
            $verName = if ($packageLine -match "versionName='([^']+)'") { $Matches[1] } else { "?" }
            Write-Host "PackageName  = $pkgName"
            Write-Host "VersionName  = $verName"
            Write-Host "VersionCode  = $verCode"
          }
        } else {
          Write-Host "aapt not found — skipping badging dump"
        }

        $apkSigner = Get-ChildItem "$sdkRoot\build-tools" -Recurse -Filter "apksigner.bat" |
                     Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
        if ($apkSigner) {
          $sigInfo = & $apkSigner verify --print-certs $apkPath 2>&1
          $sha256Line = ($sigInfo | Where-Object { $_ -match "SHA-256" }) | Select-Object -First 1
          Write-Host "Signature SHA-256 = $sha256Line"
        } else {
          Write-Host "apksigner not found — skipping cert fingerprint"
        }

        Write-Host "----------------------------------------"
        Write-Host "Project ApplicationId  = com.jon2g.tiktokstreaksaver"
        Write-Host "Tag Version = ${{ steps.get_version.outputs.VERSION }}"
        Write-Host "========================================"
      shell: pwsh
      id: apk_identity
      continue-on-error: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: ./artifacts/*.apk
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.TAG }}
        name: Streak Saver v${{ steps.get_version.outputs.VERSION }}
        # The in-app update popup renders this body as the changelog, so an auto-generated
        # "Full Changelog: <compare link>" leaves the popup with nothing to show. A written
        # changelog wins when one is supplied; generate_release_notes stays as the fallback for
        # tag pushes, which have no input to read.
        body: ${{ github.event.inputs.changelog }}
        generate_release_notes: ${{ github.event.inputs.changelog == '' }}
        files: ./artifacts/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # iOS publishes into the same release. Android creates it, so it has to run first, and iOS
    # then waits for this workflow to finish before attaching the IPA. Without this the two
    # platforms would land in separate releases and the IPA would be filed under an ios-v* tag
    # nobody downloading the APK would think to look at.
    - name: Release iOS build
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: actions/github-script@v7
      env:
        IOS_ENABLED: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 != '' && secrets.IOS_DEVELOPMENT_TEAM != '' }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const version = '${{ steps.get_version.outputs.VERSION }}';
          const tag = '${{ steps.get_version.outputs.TAG }}';

          if (process.env.IOS_ENABLED !== 'true') {
            core.notice(`Skipping iOS build for ${tag}: IOS_DISTRIBUTION_CERTIFICATE_BASE64 and/or IOS_DEVELOPMENT_TEAM are not set. See docs/ios-signing.md.`);
            return;
          }

          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'ios-release.yml',
            ref: 'main',
            inputs: { version: version, release_tag: tag }
          });

          core.notice(`Dispatched iOS build for ${tag}. The IPA is attached to that release when it finishes.`);

